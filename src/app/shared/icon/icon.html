<svg

  [attr.height]="size()"

  fill="none"
  stroke="currentColor"
  stroke-width="1.9"
  stroke-linecap="round"
  stroke-linejoin="round"

      <path d="M4 12h15" />

    }
    @case ('arrow-up-right') {

    }

      <path d="M20 6L9 17l-5-5" />

      <rect x="3" y="3.5" width="18" height="13" rx="3" />

      <circle cx="7.5" cy="19.5" r="1.5" />
      <circle cx="16.5" cy="19.5" r="1.5" />

    @case ('instagram') {
      <rect x="2.5" y="2.5" width="19" height="19" rx="5.5" />
      <circle cx="12" cy="12" r="4.3" />

    @case ('facebook') {

      <path d="M14 3v10.4a3.3 3.3 0 1 1-2.8-3.3" />
      <path d="M14 3c.5 2.5 2 4.1 4.5 4.4" />

    @case ('youtube') {
      <rect x="2.5" y="5" width="19" height="14" rx="4.5" />
      <path d="M10.4 9.1l5.2 2.9-5.2 2.9z" fill="currentColor" stroke="none" />
    }
    @default {
      <circle cx="12" cy="12" r="8" />
    }
  }
</svg>
