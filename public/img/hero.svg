<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 560" width="600" height="560" role="img" aria-labelledby="heroTitle">
  <title id="heroTitle">Tres niñas y niños jugando con bloques y un globo</title>
  <defs>
    <linearGradient id="sky" x1="0" y1="0" x2="0" y2="1">
