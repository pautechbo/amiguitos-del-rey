<section class="section testimonials" id="testimonios">
  <div class="container">
    <div class="section-head section-head--center" appReveal>
      <span class="eyebrow">Familias</span>
      <h2 class="section-title">Lo que dicen <span class="highlight">las familias</span></h2>

      <div class="testimonials__rating">
        <span class="testimonials__stars" aria-hidden="true">
          @for (star of stars; track star) {
            <app-icon name="star" [size]="18" />
          }
        </span>
        <p><strong>4.9 de 5</strong> · 86 reseñas de familias</p>
      </div>
    </div>

    <div class="testimonials__grid">
      @for (item of testimonials; track item.name; let i = $index) {
        <figure
          [class]="'testimonial testimonial--' + item.theme"
          appReveal
          [style.--reveal-delay]="i * 90 + 'ms'"
        >
          <span class="testimonial__quote" aria-hidden="true">“</span>

          <blockquote>{{ item.quote }}</blockquote>

          <figcaption>
            <span [class]="'testimonial__avatar testimonial__avatar--' + item.theme">
              {{ item.initials }}
            </span>
            <span class="testimonial__meta">
              <strong>{{ item.name }}</strong>
              <span>{{ item.relation }}</span>
            </span>
          </figcaption>
        </figure>
      }
    </div>
  </div>
</section>
