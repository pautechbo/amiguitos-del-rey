<span class="logo" [class.logo--light]="variant() === 'light'">
  <span class="logo__mark" aria-hidden="true">
    <svg viewBox="0 0 48 48" fill="none">
      <rect width="48" height="48" rx="15" fill="url(#logoGradient)" />
      <path
        d="M12 31.5h24L33.6 19l-5.9 4.5L24 15l-3.7 8.5L14.4 19z"
        fill="#fff"
      />
      <circle cx="24" cy="34.5" r="2.4" fill="#fff" opacity=".85" />
      <defs>
        <linearGradient id="logoGradient" x1="0" y1="0" x2="48" y2="48" gradientUnits="userSpaceOnUse">
          <stop stop-color="#FFC531" />
          <stop offset=".55" stop-color="#EF4B45" />
          <stop offset="1" stop-color="#7A4BD6" />
        </linearGradient>
      </defs>
    </svg>
  </span>
  <span class="logo__text">
    <span class="logo__name">Amiguitos</span>
    <span class="logo__sub">del Rey</span>
  </span>
</span>
